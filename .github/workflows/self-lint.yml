# Self-lint for this repo — actionlint over every workflow (reusable +
# examples) on pull_request and on push to main (no duplicate runs for
# PR branches). Catches broken expressions, invalid
# input types, and shellcheck issues in run blocks before callers copy
# anything.

name: Self Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: self-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # shellcheck runs automatically when installed (it is on
      # ubuntu-latest), so run blocks are linted too.
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml examples/*.yml

  gate-logic-tests:
    name: gate logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Dry-run of the inline github-script logic (severity classifier,
      # block_unlabeled, explicit-P2, QA draft/synchronize ordering) with
      # mocked GitHub API — no network, no tokens.
      - name: Run gate logic tests
        run: node tests/gates.test.js

      # Acceptance Gate inline Python (config resolution, diff/coverage
      # parsing, metric evaluation, sticky-comment rendering).
      - name: Run acceptance gate tests
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet 'pyyaml==6.0.2'
          python3 tests/acceptance_test.py

      - name: Reject workflow self-listeners
        run: |
          python3 scripts/check-no-self-listen.py
          python3 tests/no_self_listen_test.py
