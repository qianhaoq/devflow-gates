# Mirror Required Check — anti-ghost ack for irrelevant labeled/unlabeled.
#
# When a gate caller listens for labeled/unlabeled but skips the real
# evaluator for unrelated labels, GitHub still opens a check suite with no
# run named like the required check ("codex / Codex Review Gate") → hangs
# on "is expected". This reusable job re-posts the LATEST conclusion for
# that exact check name on the PR head via the Checks API (no false green:
# it never invents success when nothing prior exists; it never runs while
# a same-named check is still in flight).
#
# Call from the product caller ONLY for irrelevant labels; keep the real
# gate job for gate-relevant labels (skip-codex-gate / qa-passed / …).
#
# Check name produced by THIS job's Actions wrapper is
# "<caller job id> / Mirror Required Check" (harmless side check). The
# required name is created explicitly via checks.create below.

name: Reusable Mirror Required Check

on:
  workflow_call:
    inputs:
      check_name:
        description: 'Exact required check name to mirror (e.g. "codex / Codex Review Gate")'
        required: true
        type: string
      runs_on:
        description: 'Runner label or JSON array string'
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  checks: write

jobs:
  mirror:
    name: Mirror Required Check
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 2
    permissions:
      contents: read
      checks: write
    steps:
      - name: Mirror latest required-check conclusion
        uses: actions/github-script@v7
        env:
          CHECK_NAME: ${{ inputs.check_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkName = (process.env.CHECK_NAME || '').trim();
            if (!checkName) {
              core.setFailed('check_name input is empty');
              return;
            }
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.info('No pull_request.head.sha on this event — nothing to mirror');
              return;
            }
            const label = context.payload.label?.name || '';
            const action = context.payload.action || context.eventName;

            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: sha,
              check_name: checkName,
              per_page: 100,
            });
            const attemptAt = (r) => Date.parse(r.completed_at || r.started_at || r.created_at || 0) || 0;
            const sorted = (runs || []).slice().sort(
              (a, b) => (attemptAt(b) - attemptAt(a)) || ((b.id || 0) - (a.id || 0))
            );
            const latest = sorted[0];

            if (latest && latest.status && latest.status !== 'completed') {
              // An in-flight same-named check already covers the required
              // name for this head — posting a mirror would race it.
              core.info(`Latest "${checkName}" is still ${latest.status} (id ${latest.id}) — not mirroring`);
              return;
            }
            if (!latest || !latest.conclusion) {
              // Do not invent success/neutral: a brand-new head with no
              // prior gate result must wait for a real evaluate.
              core.info(`No completed prior "${checkName}" on ${sha.slice(0, 7)} — not inventing a conclusion`);
              return;
            }

            const conclusion = latest.conclusion;
            const title = `Label ack: mirrored ${conclusion}`;
            const summary = [
              `Irrelevant label \`${label || '(none)'}\` (${action}) on head \`${sha.slice(0, 7)}\`.`,
              `Re-posted previous \`${checkName}\` conclusion (**${conclusion}**) so this check suite does not leave the required check as "is expected".`,
              'Gate-relevant labels still run the real evaluator.',
            ].join('\n\n');

            await github.rest.checks.create({
              owner,
              repo,
              name: checkName,
              head_sha: sha,
              status: 'completed',
              conclusion,
              output: { title, summary },
            });
            core.info(`Mirrored "${checkName}" = ${conclusion} on ${sha.slice(0, 7)}`);
