# Mirror Required Check — anti-ghost ack for irrelevant labeled/unlabeled.
#
# When a gate caller listens for labeled/unlabeled but skips the real
# evaluator for unrelated labels, GitHub opens a check suite with no run
# named like the required check ("codex / Codex Review Gate") and the PR
# hangs on "is expected".
#
# This job IS the required check: the caller job sets `name:` to the
# required prefix (codex / qa / editorial) and passes `job_name` (e.g.
# "Codex Review Gate"), so the Actions job itself is named
# "codex / Codex Review Gate". Its CONCLUSION expresses the latest REAL
# (non-ack) same-named gate verdict: success -> exit 0, anything else ->
# exit non-zero. No checks.create (API-created checks landed in arbitrary
# github-actions suites and were duplicated by GitHub on suite re-runs).
#
# - Newest real attempt in flight / not yet present -> poll up to
#   wait_minutes, then fail (never invents green). Keep wait_minutes above
#   the real gate's own maximum runtime: a failed ack is NEWER than a
#   slower real run and would mask its later result.
# - Latest real verdict cancelled -> cancel-heal re-run of that workflow
#   (attempt cap 3, PR comment at cap, same-PR in-flight guard), then keep
#   polling for the re-run's verdict.
# - Success is mirrored only if current relevant-label state matches the
#   label event history at the source verdict; uncertainty -> failure.
# - Sources: same-named Actions jobs that are not acks. Acks are recognised
#   by the step name below (and legacy API-created "Label ack" checks).
#
# Concurrency: the caller's workflow-level label-{sha} group serialises ack
# and relevant-label evaluate (only relevant labels cancel). No job-level
# cancel here: a cancelled ack would itself be a cancelled required check.

name: Reusable Mirror Required Check

on:
  workflow_call:
    inputs:
      check_name:
        description: 'Exact required check name (e.g. "codex / Codex Review Gate"); must equal "<caller job name> / <job_name>"'
        required: true
        type: string
      job_name:
        description: 'Name of this job: the part of check_name after "<caller job name> / " (e.g. "Codex Review Gate")'
        required: true
        type: string
      relevant_labels:
        description: 'Gate-relevant labels, comma or newline separated (required to mirror success)'
        type: string
        required: false
        default: ''
      wait_minutes:
        description: 'Max minutes to wait for an in-flight/missing real verdict before failing (1-60; exceed the real gate runtime)'
        required: false
        type: number
        default: 30
      runs_on:
        description: 'Runner label or JSON array string'
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  checks: read
  actions: write
  issues: write
  pull-requests: read  # private repos: issues.get/listEvents on PRs

jobs:
  mirror:
    name: ${{ inputs.job_name }}
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 70
    permissions:
      contents: read
      checks: read
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Label ack mirror latest real gate verdict
        uses: actions/github-script@v7
        env:
          CHECK_NAME: ${{ inputs.check_name }}
          JOB_NAME: ${{ inputs.job_name }}
          RELEVANT_LABELS: ${{ inputs.relevant_labels }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
          POLL_SECONDS: '20'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkName = (process.env.CHECK_NAME || '').trim();
            const jobName = (process.env.JOB_NAME || '').trim();
            if (!checkName || !jobName || !checkName.endsWith(` / ${jobName}`)) {
              core.setFailed(`check_name "${checkName}" must end with " / ${jobName}" (job_name)`);
              return;
            }
            const ACK_STEP = 'Label ack mirror latest real gate verdict';
            const sha = context.payload.pull_request?.head?.sha;
            const number = context.payload.pull_request?.number;
            if (!sha || !number) {
              core.setFailed('No pull_request head on this event — cannot mirror (refusing to pass)');
              return;
            }
            const label = context.payload.label?.name || '';
            const action = context.payload.action || context.eventName;
            const waitMin = Math.min(Math.max(Number(process.env.WAIT_MINUTES ?? 30), 0), 60);
            const pollMs = Math.max(Number(process.env.POLL_SECONDS ?? 20), 0) * 1000;
            const deadline = Date.now() + waitMin * 60000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Check run ids are allocated monotonically; every rerun attempt gets a
            // new id, so highest id = newest attempt. Timestamps only tiebreak.
            function ts(v) { const n = Date.parse(v || ''); return Number.isFinite(n) ? n : 0; }
            function byNewest(a, b) {
              return ((b.id || 0) - (a.id || 0))
                || (ts(b.started_at) - ts(a.started_at))
                || (ts(b.completed_at) - ts(a.completed_at));
            }
            function runIdOf(r) {
              const m = String(r?.details_url || r?.html_url || '').match(/\/actions\/runs\/(\d+)/);
              return m ? Number(m[1]) : null;
            }
            // 'ack' | 'real' | 'unknown' (queued job, no steps yet). Known kinds cached.
            const kinds = new Map();
            async function kindOf(r) {
              if (/^Label ack/.test(r?.output?.title || '')) return 'ack';   // legacy API mirror
              const runId = runIdOf(r);
              if (!runId) return 'ack';                                        // not an Actions job
              if (runId === Number(context.runId)) return 'ack';               // this run (incl. re-run attempts)
              if (kinds.has(r.id)) return kinds.get(r.id);
              const { data: job } = await github.rest.actions.getJobForWorkflowRun({ owner, repo, job_id: r.id });
              const steps = job.steps || [];
              // No steps: queued (not started) -> unknown, re-checked next poll.
              // Completed without steps (cancelled before start) -> treat as
              // real so the cancelled-heal path re-runs it (re-running a
              // cancelled ack is harmless: it excludes its own run).
              if (!steps.length) {
                if (job.status === 'completed' || r.status === 'completed') { kinds.set(r.id, 'real'); return 'real'; }
                return 'unknown';
              }
              const k = steps.some((s) => s.name === ACK_STEP) ? 'ack' : 'real';
              kinds.set(r.id, k);
              return k;
            }
            async function snapshot() {
              const list = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, check_name: checkName, filter: 'all', per_page: 100,
              });
              // Newest first; stop at the first non-ack (older checks cannot
              // matter) to keep Jobs API calls bounded on long-lived heads.
              for (const r of [...(list || [])].sort(byNewest)) {
                const k = await kindOf(r);
                if (k !== 'ack') return { ...r, kind: k };
              }
              return null;
            }
            const same = (a, b) => !!a && !!b && a.id === b.id && a.status === b.status && a.conclusion === b.conclusion;

            async function labelsConfirm(source) {
              const relevant = new Set((process.env.RELEVANT_LABELS || '').split(/[,\n]/).map((s) => s.trim()).filter(Boolean));
              if (!relevant.size) throw new Error('relevant_labels missing');
              const { data: pr } = await github.rest.issues.get({ owner, repo, issue_number: number });
              if (!Array.isArray(pr.labels)) throw new Error('current labels missing');
              const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number: number, per_page: 100 });
              if (!Array.isArray(events)) throw new Error('label events missing');
              const cutoff = Date.parse(source.started_at || source.completed_at || '');
              if (!Number.isFinite(cutoff)) throw new Error('source verdict timestamp missing');
              for (const name of relevant) {
                const history = events.filter((e) => e.label?.name === name && ['labeled', 'unlabeled'].includes(e.event));
                if (history.some((e) => !Number.isFinite(Date.parse(e.created_at)))) throw new Error(`invalid history for ${name}`);
                history.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || (b.id || 0) - (a.id || 0));
                const last = history[0];
                const present = pr.labels.some((l) => (typeof l === 'string' ? l : l.name) === name);
                if ((!last && present) || (last && (Date.parse(last.created_at) >= cutoff || (last.event === 'labeled') !== present))) {
                  throw new Error(`label state cannot be confirmed at source verdict: ${name}`);
                }
              }
            }

            async function heal(latest) {
              const run_id = runIdOf(latest);
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
              if ((run.run_attempt || 1) >= 3) {
                const message = `Cancelled heal for "${checkName}" reached the attempt cap (run ${run_id}, run_attempt=${run.run_attempt || 1}). Please rerun manually in the Actions UI or push a new commit.`;
                try {
                  await github.rest.issues.createComment({ owner, repo, issue_number: number, body: message });
                } catch (error) {
                  core.info(`Could not comment on PR #${number}: ${error.message}`);
                }
                return message;
              }
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: run.workflow_id, per_page: 100,
              });
              const active = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
              // PRT workflow head_sha is the base SHA; match the PR association.
              // Our own run is in flight too: never count it.
              if (workflowRuns.some((r) => r.id !== run_id && r.id !== Number(context.runId) && active.has(r.status)
                && (r.pull_requests || []).some((p) => p.number === number))) {
                core.info(`Workflow ${run.workflow_id} already has an in-flight run for PR #${number} — not re-running ${run_id}`);
                return null;
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id });
              core.info(`Latest "${checkName}" was cancelled — heal re-run of workflow run ${run_id}; waiting for its verdict`);
              return null;
            }

            const healed = new Set();
            let reason = '';
            for (let first = true; ; first = false) {
              if (!first) {
                if (Date.now() >= deadline) break;
                await sleep(pollMs);
              }
              let latest;
              try {
                latest = await snapshot();
              } catch (error) {
                core.setFailed(`Cannot read/classify "${checkName}" checks: ${error.message}`);
                return;
              }
              if (!latest) { reason = `no real "${checkName}" verdict on ${sha.slice(0, 7)} yet`; core.info(reason); continue; }
              if (latest.kind === 'unknown' || (latest.status && latest.status !== 'completed') || !latest.conclusion) {
                reason = `newest real "${checkName}" (id ${latest.id}) is still ${latest.status || 'queued'}`;
                core.info(reason);
                continue;
              }
              const c = latest.conclusion;
              if (c === 'cancelled') {
                if (healed.has(latest.id)) { reason = `cancelled check ${latest.id} awaiting heal re-run`; continue; }
                healed.add(latest.id);
                const capped = await heal(latest);
                if (capped) { core.setFailed(capped); return; }
                reason = `cancelled check ${latest.id} healed; waiting`;
                continue;
              }
              if (c !== 'success') {
                if (!same(await snapshot(), latest)) { reason = 'source changed'; continue; }
                core.setFailed(`Label ack (${action} \`${label}\`): latest real "${checkName}" is ${c} (source check ${latest.id})`);
                return;
              }
              try {
                await labelsConfirm(latest);
              } catch (error) {
                if (!same(await snapshot(), latest)) { reason = 'source changed'; continue; }
                core.setFailed(`Success refused: ${error.message}. Run the real gate evaluator again (source check ${latest.id}).`);
                return;
              }
              // Label API reads may overlap a real evaluation: only conclude on an
              // unchanged newest source.
              if (!same(await snapshot(), latest)) { reason = 'source changed during label validation'; continue; }
              core.info(`Label ack (${action} \`${label}\`): mirrored "${checkName}" = success (source check ${latest.id})`);
              return;
            }
            core.setFailed(`Timed out after ${waitMin} min waiting for a real "${checkName}" verdict (${reason}). Rerun this job or use /recheck once the gate finishes.`);
