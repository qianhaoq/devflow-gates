# QA Gate — reusable, label-timed manual-QA status check.
#
# Called from a repo's own gate workflow (see examples/qa-gate.yml):
#   uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@main
#
# Check name on a PR is "<caller job name> / <called job name>"; with the
# example caller (job id `qa`) this produces "qa / QA Gate". Use that
# exact string in branch protection / Rulesets and in auto-merge.yml's
# `required_checks` input.
#
# Semantics:
#   - Manual QA signs off by applying the `qa_label` (default
#     "qa-passed") AFTER verifying the PR head, per templates/QA.md.
#   - On synchronize (new push) the gate REMOVES the label if present and
#     FAILS with "new push invalidated QA" — QA must re-run on the new
#     head and re-apply the label.
#   - Otherwise the gate passes only if the label is present AND its most
#     recent 'labeled' event is LATER than the latest head-commit push
#     time (only 'labeled' events whose actor is in `allowed_labelers`
#     count, when that input is set). Push time = max(head commit committer date, 'committed'
#     timeline events for the head SHA, 'head_ref_force_pushed' timeline
#     events). A label that predates the last push is stale → fail.
#   - Draft PR → fail (checked after the synchronize label removal, so a
#     push to a draft still strips the label). Non-PR contexts (no resolvable PR / closed PR) →
#     info + success (nothing to gate). workflow_dispatch with an
#     invalid/nonnumeric pr_number FAILS (operator error must be loud).
#
# Scheduled refresh (QA Gate Refresh job, schedule-path only): a
# scheduled run's job conclusion does NOT attach to any PR head check
# (neither does workflow_dispatch), so the schedule path never evaluates
# itself. For each open non-draft PR whose latest
# pull_request_target-originated Gate run for that head SHA completed
# with conclusion failure, it re-runs that run's failed jobs
# (actions.reRunWorkflowFailedJobs) — the re-run keeps the original
# pull_request_target event, so the fresh conclusion re-attaches to the
# PR head check (e.g. after a timing race left the check red). Needs
# `actions: write`, granted by the CALLER on the schedule-path job only
# (see examples/qa-gate.yml, job `qa-refresh`).
#
# The synchronize label-removal needs `pull-requests: write` and
# `issues: write` — the CALLER must grant them (a reusable workflow can
# only restrict permissions further, never elevate them).
#
# Security: gate logic uses ONLY actions/github-script + the GitHub API;
# it never checks out the PR head and never runs PR-controlled code.

name: Reusable QA Gate

on:
  workflow_call:
    inputs:
      qa_label:
        description: 'Label that marks a manually QA-verified PR head'
        required: false
        type: string
        default: 'qa-passed'
      allowed_labelers:
        description: >-
          Optional comma/space-separated GitHub logins whose 'labeled' event
          counts as sign-off (only the LAST labeled event for the label counts;
          a later unlabeled = no sign-off). Empty string (default/unset) = any
          user with label rights; set but no logins (e.g. " " or ",") = FAIL.
          When set, a label applied by anyone else (incl. the PR author, unless
          listed) is ignored and the gate fails.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa-gate:
    name: QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Schedule never evaluates directly (a scheduled conclusion does not
    # attach to the PR head check) — the refresh job below handles it.
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Evaluate QA label
        uses: actions/github-script@v7
        env:
          QA_LABEL: ${{ inputs.qa_label }}
          ALLOWED_LABELERS: ${{ inputs.allowed_labelers }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const QA_LABEL = (process.env.QA_LABEL || 'qa-passed').trim() || 'qa-passed';
            const ALLOWED = (process.env.ALLOWED_LABELERS || '')
              .split(/[\s,]+/).map((s) => s.trim().toLowerCase()).filter(Boolean);

            async function resolvePrNumber() {
              if (context.payload.pull_request?.number) return context.payload.pull_request.number;
              if (context.eventName === 'workflow_dispatch') {
                const n = Number(context.payload.inputs?.pr_number);
                return Number.isInteger(n) && n > 0 ? n : null;
              }
              return null;
            }

            function fmt(ts) {
              return new Date(ts).toISOString().replace('T', ' ').replace('.000Z', ' UTC');
            }

            const prNumber = await resolvePrNumber();
            if (!prNumber) {
              if (context.eventName === 'workflow_dispatch') {
                // Operator-typed input must be validated loudly: a silent
                // green skip would look like a passing gate.
                const raw = context.payload.inputs?.pr_number;
                core.setFailed(`workflow_dispatch pr_number is invalid or missing: ${JSON.stringify(raw ?? '')}`);
                return;
              }
              core.info('No PR number resolved for this event — nothing to gate');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.merged || pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.merged ? 'merged' : pr.state} — nothing to gate`);
              return;
            }

            const sha = pr.head.sha;
            const hasLabel = pr.labels.some((l) => l.name === QA_LABEL);

            // New push: invalidate QA. Remove the label (if present) so a
            // stale sign-off can never satisfy this gate or auto-merge,
            // then fail. Removing an issue label needs issues:write /
            // pull-requests:write granted by the CALLER.
            if (context.eventName === 'pull_request_target' && context.payload.action === 'synchronize') {
              if (hasLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: QA_LABEL,
                  });
                  core.info(`Removed label "${QA_LABEL}" from PR #${prNumber} (new push)`);
                } catch (err) {
                  core.warning(
                    `Could not remove label "${QA_LABEL}" (${err.message}) — the caller workflow must grant pull-requests:write and issues:write`
                  );
                }
              }
              const msg = `new push invalidated QA — head is now ${sha.slice(0, 7)}; re-run manual QA (templates/QA.md) and re-apply "${QA_LABEL}"`;
              core.info(`PR #${prNumber}: ${msg}`);
              core.setFailed(msg);
              return;
            }

            // Draft check runs AFTER the synchronize invalidation so a
            // draft PR cannot keep a stale QA label across a push.
            if (pr.draft) {
              const msg = 'PR is draft — QA gate fails until ready_for_review';
              core.info(`PR #${prNumber}: ${msg}`);
              core.setFailed(msg);
              return;
            }

            if (!hasLabel) {
              const msg = `PR #${prNumber} has no "${QA_LABEL}" label — manual QA not signed off on head ${sha.slice(0, 7)}. Follow templates/QA.md, verify the latest head, then apply the label.`;
              core.setFailed(msg);
              return;
            }

            // Most recent 'labeled' event for QA_LABEL (issue events).
            const issueEvents = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            // allowed_labelers: '' (unset) = legacy, anyone with label rights.
            // Set but parsing to an empty list (" ", ",") = misconfiguration → FAIL.
            const ALLOWED_RAW = process.env.ALLOWED_LABELERS ?? '';
            if (ALLOWED_RAW !== '' && ALLOWED.length === 0) {
              core.setFailed(`allowed_labelers is set (${JSON.stringify(ALLOWED_RAW)}) but contains no logins — refusing to accept any "${QA_LABEL}" sign-off`);
              return;
            }
            // Only the LAST 'labeled' event for QA_LABEL decides; a later
            // 'unlabeled' event for it means the label is not applied.
            const labelEvents = issueEvents
              .filter((e) => (e.event === 'labeled' || e.event === 'unlabeled') && e.label?.name === QA_LABEL && e.created_at)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at) || (a.id || 0) - (b.id || 0));
            const last = labelEvents[labelEvents.length - 1];
            if (!last || last.event !== 'labeled') {
              core.setFailed(last
                ? `Label "${QA_LABEL}" was removed after it was last applied — treat as not signed off`
                : `Label "${QA_LABEL}" is present but no 'labeled' event was found — cannot verify it postdates the latest push`);
              return;
            }
            const labeler = String(last.actor?.login || '').toLowerCase();
            if (ALLOWED.length && !ALLOWED.includes(labeler)) {
              core.setFailed(`Label "${QA_LABEL}" was last applied by "${last.actor?.login || 'unknown'}", not an allowed labeler (${ALLOWED.join(', ')}) — sign-off by other users (incl. the PR author) does not count`);
              return;
            }
            const labeledTime = new Date(last.created_at).getTime();

            // Latest push time for the head SHA: max of the head commit's
            // committer date, 'committed' timeline events for that SHA,
            // and 'head_ref_force_pushed' timeline events.
            let pushTime = 0;
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: sha,
            });
            if (headCommit.commit?.committer?.date) {
              pushTime = new Date(headCommit.commit.committer.date).getTime();
            }

            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            for (const ev of timeline) {
              if (!ev.created_at) continue;
              if (ev.event === 'committed' && ev.sha === sha) {
                pushTime = Math.max(pushTime, new Date(ev.created_at).getTime());
              }
              if (ev.event === 'head_ref_force_pushed') {
                pushTime = Math.max(pushTime, new Date(ev.created_at).getTime());
              }
            }

            core.info(
              `"${QA_LABEL}" applied at ${fmt(labeledTime)}; latest push to head ${sha.slice(0, 7)} at ${fmt(pushTime)}`
            );

            if (labeledTime <= pushTime) {
              const msg = `QA label "${QA_LABEL}" predates the latest push (label ${fmt(labeledTime)} <= push ${fmt(pushTime)}). Re-run QA on head ${sha.slice(0, 7)} and re-apply the label.`;
              core.setFailed(msg);
              return;
            }

            core.info(`QA verified: "${QA_LABEL}" applied after the latest push to ${sha.slice(0, 7)}`);
            // Success = job conclusion ("<caller job> / QA Gate").

  # Schedule-path only. A scheduled run's conclusion does not attach to
  # any PR head check, and neither does a workflow_dispatch run — so this
  # job never evaluates. It re-runs the most recent FAILED
  # pull_request_target-originated Gate run for every open non-draft PR
  # (actions.reRunWorkflowFailedJobs); the re-run keeps the original
  # pull_request_target event, so the fresh conclusion re-attaches to the
  # PR head check. Needs actions:write granted by the CALLER on its
  # schedule-path job (see examples/qa-gate.yml, job `qa-refresh`).
  qa-gate-refresh:
    name: QA Gate Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Refresh failing gate checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The run belongs to the CALLER workflow; identify it so we
            // re-run its (not some other workflow's) failed gate runs.
            const { data: thisRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });
            const workflowId = thisRun.workflow_id;
            core.info(`Refreshing gate checks for workflow "${thisRun.name}" (id ${workflowId})`);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            let scanned = 0;
            let rerun = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              scanned += 1;
              const sha = pr.head.sha;
              const { data: runsData } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                event: 'pull_request_target',
                status: 'completed',
                per_page: 20,
              });
              const runs = (runsData.workflow_runs || [])
                .filter((r) => r.head_sha === sha)
                .sort((a, b) => (b.run_number - a.run_number) || ((b.id || 0) - (a.id || 0)));
              const latest = runs[0];
              // Only re-run when the gate check on this head is failing:
              // the latest completed pull_request_target run's conclusion
              // IS that check. Success/missing/still-running → nothing to
              // refresh.
              if (!latest || latest.conclusion !== 'failure') continue;
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner,
                repo,
                run_id: latest.id,
              });
              rerun += 1;
              core.info(
                `PR #${pr.number}: re-running failed jobs of run ${latest.id} (pull_request_target, head ${sha.slice(0, 7)})`
              );
            }
            core.info(
              `QA Gate Refresh done: ${scanned} open non-draft PR(s) scanned, ${rerun} failing gate run(s) re-run`
            );
