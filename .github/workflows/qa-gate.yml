# QA Gate — reusable, label-timed manual-QA status check.
#
# Called from a repo's own gate workflow (see examples/qa-gate.yml):
#   uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@main
#
# Check name on a PR is "<caller job name> / <called job name>"; with the
# example caller (job id `qa`) this produces "qa / QA Gate". Use that
# exact string in branch protection / Rulesets and in auto-merge.yml's
# `required_checks` input.
#
# Semantics:
#   - Manual QA signs off by applying the `qa_label` (default
#     "qa-passed") AFTER verifying the PR head, per templates/QA.md.
#   - On synchronize (new push) the gate REMOVES the label if present
#     (unless the sign-off is already bound to the new head — race guard,
#     see below) and FAILS with "new push invalidated QA" — QA must re-run
#     on the new head and re-apply the label.
#   - Otherwise the gate passes only if the label is present AND its most
#     recent 'labeled' event (only events whose actor is in
#     `allowed_labelers` count, when that input is set) is BOUND to the
#     current head SHA: among GitHub's own server-timestamped observations
#     of this PR's head — this caller workflow's pull_request_target runs
#     (incl. cancelled ones), its workflow_dispatch runs on the PR branch,
#     and the current event payload — the latest one created strictly
#     before the label is for the current head, and no
#     head_ref_force_pushed event to another SHA lies in between.
#     Committer dates are author-controlled (can be backdated) and are
#     NEVER used. A stale label found on any event (e.g. the push's
#     synchronize run was cancelled by a later label event) is REMOVED
#     and the gate fails — fail closed, independent of the caller's
#     concurrency settings.
#   - Opt-in `keep_qa_on_clean_main_update: true`: a synchronize whose new
#     head H only merges the base branch cleanly into the QA-tested head B
#     (= event.before) KEEPS the label: H has exactly 2 parents, parent1 ==
#     B, parent2 is on the base branch; `git merge-tree --write-tree B P2`
#     is conflict-free and equals H^{tree}; files changed on the base since
#     merge-base(B, P2) do not intersect files changed by the PR; and the
#     sign-off (allowed labeler, label bound to B as above — or B itself a
#     kept clean merge) covered B. A sticky PR comment records it; later
#     evaluations walk back over such clean merges to the QA-tested head.
#     Anything else, incl. any git/fetch error or missing `before`, strips
#     as before and writes the reason to the job summary.
#   - Draft PR → fail (checked after the synchronize label removal, so a
#     push to a draft still strips the label). Non-PR contexts (no resolvable PR / closed PR) →
#     info + success (nothing to gate). workflow_dispatch with an
#     invalid/nonnumeric pr_number FAILS (operator error must be loud).
#
# Scheduled refresh (QA Gate Refresh job, schedule-path only, OPTIONAL):
# no blind re-runs. It re-runs a failed head gate run only when the QA
# label was applied after that run evaluated (input changed), else at
# most the newest cancelled head run; one re-run per PR, never past
# run_attempt 3 (see the job comment). Needs `actions: write`, granted by
# the CALLER on the schedule-path job only (examples/qa-gate.yml,
# `qa-refresh`). The example caller ships without a cron: every QA input
# change is itself a pull_request_target event.
#
# Filtering: the CALLER skips label events for other labels with a
# job-level `if:` (a skipped caller job attaches a check named "qa", never
# the required "qa / QA Gate"). This file never skips a head-attached
# event itself (that would attach a skipped = passing required check).
#
# The synchronize label-removal needs `pull-requests: write` and
# `issues: write` — the CALLER must grant them (a reusable workflow can
# only restrict permissions further, never elevate them).
#
# Security: gate logic uses ONLY actions/github-script + the GitHub API;
# it never checks out the PR head and never runs PR-controlled code. With
# keep_qa_on_clean_main_update the step additionally runs git PLUMBING
# (fetch, rev-list, merge-base, merge-tree, diff --name-only) in a fresh
# bare repo under RUNNER_TEMP — objects only, no worktree, no hooks, no
# PR-supplied config; needs git >= 2.38 (ubuntu-latest has it).

name: Reusable QA Gate

on:
  workflow_call:
    inputs:
      qa_label:
        description: 'Label that marks a manually QA-verified PR head'
        required: false
        type: string
        default: 'qa-passed'
      allowed_labelers:
        description: >-
          Optional comma/space-separated GitHub logins whose 'labeled' event
          counts as sign-off (only the LAST labeled event for the label counts;
          a later unlabeled = no sign-off). Empty string (default/unset) = any
          user with label rights; set but no logins (e.g. " " or ",") = FAIL.
          When set, a label applied by anyone else (incl. the PR author, unless
          listed) is ignored and the gate fails.
        required: false
        type: string
        default: ''
      keep_qa_on_clean_main_update:
        description: >-
          Opt-in. On a push (synchronize) KEEP the QA label instead of
          stripping it when the new head is ONLY a clean merge of the base
          branch into the head QA signed off: 2-parent merge, parent1 = the
          previous head, parent2 on the base branch, `git merge-tree
          --write-tree` of the parents is conflict-free and equals the head
          tree, and no file changed on the base since the merge base is also
          changed by the PR. Anything else (or any git error) strips as usual.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa-gate:
    name: QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read — the sign-off is bound to a head SHA via this
    # workflow's own pull_request_target / workflow_dispatch run records
    # (server-side head observations), on every evaluation.
    # Callers already grant actions: write on this job (the refresh job in
    # this file needs it, and GitHub checks every job against the ceiling).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    # Schedule never evaluates directly (a scheduled conclusion does not
    # attach to the PR head check) — the refresh job below handles it.
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Evaluate QA label
        uses: actions/github-script@v7
        env:
          QA_LABEL: ${{ inputs.qa_label }}
          ALLOWED_LABELERS: ${{ inputs.allowed_labelers }}
          KEEP_QA_ON_CLEAN_MAIN_UPDATE: ${{ inputs.keep_qa_on_clean_main_update }}
          # Read-only fetch token for the clean-main-update check; only
          # handed to the step when the feature is on. Never printed (git
          # runs silent, auth goes via GIT_CONFIG_* env, not argv/URL).
          QA_GIT_TOKEN: ${{ inputs.keep_qa_on_clean_main_update && github.token || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const QA_LABEL = (process.env.QA_LABEL || 'qa-passed').trim() || 'qa-passed';
            const ALLOWED = (process.env.ALLOWED_LABELERS || '')
              .split(/[\s,]+/).map((s) => s.trim().toLowerCase()).filter(Boolean);
            const KEEP_CLEAN = String(process.env.KEEP_QA_ON_CLEAN_MAIN_UPDATE || '').trim().toLowerCase() === 'true';
            const IS_SYNC = context.eventName === 'pull_request_target' && context.payload.action === 'synchronize';

            async function resolvePrNumber() {
              if (context.payload.pull_request?.number) return context.payload.pull_request.number;
              if (context.eventName === 'workflow_dispatch') {
                const n = Number(context.payload.inputs?.pr_number);
                return Number.isInteger(n) && n > 0 ? n : null;
              }
              return null;
            }

            function fmt(ts) {
              return new Date(ts).toISOString().replace('T', ' ').replace('.000Z', ' UTC');
            }
            const short = (s) => String(s || '').slice(0, 7);

            async function summary(text) {
              try {
                await core.summary.addRaw(text + '\n').write();
              } catch (err) {
                core.info(`(job summary unavailable: ${err.message})`);
              }
            }

            const prNumber = await resolvePrNumber();
            if (!prNumber) {
              if (context.eventName === 'workflow_dispatch') {
                // Operator-typed input must be validated loudly: a silent
                // green skip would look like a passing gate.
                const raw = context.payload.inputs?.pr_number;
                core.setFailed(`workflow_dispatch pr_number is invalid or missing: ${JSON.stringify(raw ?? '')}`);
                return;
              }
              core.info('No PR number resolved for this event — nothing to gate');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.merged || pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.merged ? 'merged' : pr.state} — nothing to gate`);
              return;
            }

            const sha = pr.head.sha;
            const baseRef = pr.base?.ref || 'main';
            const hasLabel = pr.labels.some((l) => l.name === QA_LABEL);

            // ---- cached API reads -------------------------------------
            let issueEventsCache = null;
            async function issueEvents() {
              if (!issueEventsCache) {
                issueEventsCache = await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
              }
              return issueEventsCache;
            }
            let timelineCache = null;
            async function timeline() {
              if (!timelineCache) {
                timelineCache = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
              }
              return timelineCache;
            }
            // Sign-off = the LAST labeled/unlabeled event for QA_LABEL is a
            // 'labeled' event by an allowed labeler (when allowed_labelers
            // is set). Returns { ok, msg, labeledTime }.
            async function signoff() {
              // allowed_labelers: '' (unset) = legacy, anyone with label rights.
              // Set but parsing to an empty list (" ", ",") = misconfiguration → FAIL.
              const ALLOWED_RAW = process.env.ALLOWED_LABELERS ?? '';
              if (ALLOWED_RAW !== '' && ALLOWED.length === 0) {
                return { ok: false, msg: `allowed_labelers is set (${JSON.stringify(ALLOWED_RAW)}) but contains no logins — refusing to accept any "${QA_LABEL}" sign-off` };
              }
              // Only the LAST 'labeled' event for QA_LABEL decides; a later
              // 'unlabeled' event for it means the label is not applied.
              const labelEvents = (await issueEvents())
                .filter((e) => (e.event === 'labeled' || e.event === 'unlabeled') && e.label?.name === QA_LABEL && e.created_at)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at) || (a.id || 0) - (b.id || 0));
              const last = labelEvents[labelEvents.length - 1];
              if (!last || last.event !== 'labeled') {
                return { ok: false, msg: last
                  ? `Label "${QA_LABEL}" was removed after it was last applied — treat as not signed off`
                  : `Label "${QA_LABEL}" is present but no 'labeled' event was found — cannot verify it postdates the latest push` };
              }
              const labeler = String(last.actor?.login || '').toLowerCase();
              if (ALLOWED.length && !ALLOWED.includes(labeler)) {
                return { ok: false, msg: `Label "${QA_LABEL}" was last applied by "${last.actor?.login || 'unknown'}", not an allowed labeler (${ALLOWED.join(', ')}) — sign-off by other users (incl. the PR author) does not count` };
              }
              return { ok: true, labeledTime: new Date(last.created_at).getTime() };
            }

            // ---- keep_qa_on_clean_main_update: git plumbing only ------
            // A throwaway BARE repo under RUNNER_TEMP: objects are fetched,
            // never checked out, no hooks, no repo config from the PR. Any
            // error → not clean (fail safe: the label is stripped).
            const SHA_RE = /^[0-9a-f]{40}$/;
            const MAX_HOPS = 10;
            let gitDir = null;
            let gitPrep = null;
            async function git(args) {
              const env = { ...process.env, GIT_TERMINAL_PROMPT: '0', GIT_CONFIG_NOSYSTEM: '1' };
              delete env.QA_GIT_TOKEN;
              const token = process.env.QA_GIT_TOKEN || '';
              if (token) {
                const auth = Buffer.from(`x-access-token:${token}`).toString('base64');
                if (core.setSecret) core.setSecret(auth);
                env.GIT_CONFIG_COUNT = '1';
                env.GIT_CONFIG_KEY_0 = 'http.extraheader';
                env.GIT_CONFIG_VALUE_0 = `AUTHORIZATION: basic ${auth}`;
              }
              const argv = gitDir ? ['-C', gitDir, ...args] : args;
              const r = await exec.getExecOutput('git', argv, { silent: true, ignoreReturnCode: true, env });
              const raw = String(r.stdout || '');
              return { code: r.exitCode, raw, out: raw.trim(), err: String(r.stderr || '').trim().split('\n').slice(-1)[0] };
            }
            async function hasCommit(s) {
              return (await git(['cat-file', '-e', `${s}^{commit}`])).code === 0;
            }
            function prepareRepo(extraShas) {
              if (!gitPrep) gitPrep = (async () => {
                const v = await git(['version']);
                const m = v.out.match(/(\d+)\.(\d+)/);
                if (v.code !== 0 || !m || Number(m[1]) < 2 || (Number(m[1]) === 2 && Number(m[2]) < 38)) {
                  return { ok: false, reason: `git >= 2.38 is required for merge-tree --write-tree (runner has: ${v.out || v.err || 'none'})` };
                }
                const fs = require('fs');
                const os = require('os');
                const path = require('path');
                const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'qa-keep-'));
                const init = await git(['init', '-q', '--bare', dir]);
                if (init.code !== 0) return { ok: false, reason: `git init failed: ${init.err}` };
                gitDir = dir;
                const fmtRef = await git(['check-ref-format', `refs/heads/${baseRef}`]);
                if (fmtRef.code !== 0) return { ok: false, reason: `unusable base ref name ${JSON.stringify(baseRef)}` };
                const url = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${owner}/${repo}.git`;
                // Full history of base + PR head (no --depth): merge-base and
                // merge-tree need real ancestry, a shallow repo would lie.
                const f = await git(['fetch', '--quiet', '--no-tags', '--no-recurse-submodules', url,
                  `+refs/heads/${baseRef}:refs/remotes/origin/${baseRef}`,
                  `+refs/pull/${prNumber}/head:refs/remotes/pr/head`]);
                if (f.code !== 0) return { ok: false, reason: `git fetch of ${baseRef} / PR head failed: ${f.err}` };
                for (const s of extraShas) {
                  if (await hasCommit(s)) continue;
                  const g = await git(['fetch', '--quiet', '--no-tags', '--no-recurse-submodules', url, s]);
                  if (g.code !== 0 || !(await hasCommit(s))) {
                    return { ok: false, reason: `commit ${short(s)} is not fetchable (force-pushed away?)` };
                  }
                }
                const sh = await git(['rev-parse', '--is-shallow-repository']);
                if (sh.code !== 0 || sh.out !== 'false') return { ok: false, reason: 'temp repo is shallow — refusing to judge ancestry' };
                return { ok: true };
              })();
              return gitPrep;
            }
            // Is commit h a clean, conflict-free merge of the base branch
            // into its first parent (expected to be `expectP1` if given)?
            const mergeCache = new Map();
            async function cleanMainMerge(h, expectP1) {
              const key = `${h}:${expectP1 || ''}`;
              if (!mergeCache.has(key)) mergeCache.set(key, cleanMainMergeUncached(h, expectP1));
              return mergeCache.get(key);
            }
            async function cleanMainMergeUncached(h, expectP1) {
              if (!(await hasCommit(h))) return { ok: false, reason: `commit ${short(h)} is not available` };
              const p = await git(['rev-list', '--parents', '-n', '1', h]);
              if (p.code !== 0) return { ok: false, reason: `cannot read parents of ${short(h)}: ${p.err}` };
              const parts = p.out.split(/\s+/).filter(Boolean);
              if (parts.length !== 3 || !parts.every((s) => SHA_RE.test(s))) {
                return { ok: false, reason: `${short(h)} is not a merge commit with exactly 2 parents` };
              }
              const [, p1, p2] = parts;
              if (expectP1 && p1 !== expectP1) {
                return { ok: false, reason: `first parent of ${short(h)} is ${short(p1)}, not the previous head ${short(expectP1)}` };
              }
              const anc = await git(['merge-base', '--is-ancestor', p2, `refs/remotes/origin/${baseRef}`]);
              if (anc.code === 1) return { ok: false, reason: `second parent ${short(p2)} of ${short(h)} is not on ${baseRef}` };
              if (anc.code !== 0) return { ok: false, reason: `merge-base --is-ancestor failed: ${anc.err}` };
              const mb = await git(['merge-base', '--all', p1, p2]);
              const bases = mb.out.split(/\s+/).filter(Boolean);
              if (mb.code !== 0 || bases.length !== 1) {
                return { ok: false, reason: bases.length > 1 ? 'multiple merge bases (criss-cross history)' : `no merge base for ${short(p1)} and ${short(p2)}` };
              }
              const mt = await git(['merge-tree', '--write-tree', '--no-messages', p1, p2]);
              if (mt.code === 1) return { ok: false, reason: `re-merging ${baseRef} into ${short(p1)} has conflicts (hand-resolved merge)` };
              if (mt.code !== 0) return { ok: false, reason: `git merge-tree failed: ${mt.err}` };
              const tree = mt.out.split('\n')[0].trim();
              const ht = await git(['rev-parse', `${h}^{tree}`]);
              if (ht.code !== 0 || !SHA_RE.test(tree) || ht.out !== tree) {
                return { ok: false, reason: `tree of ${short(h)} differs from a clean re-merge of ${short(p1)} + ${short(p2)} (conflict resolution or extra changes in the merge commit)` };
              }
              const names = async (to) => {
                const d = await git(['diff', '--name-only', '--no-renames', '--no-ext-diff', '--no-textconv', '-z', bases[0], to]);
                if (d.code !== 0) throw new Error(`git diff failed: ${d.err}`);
                // -z output is verbatim: never trim it (leading/trailing
                // whitespace can be part of a pathname).
                return d.raw.split('\0').filter((x) => x !== '');
              };
              const mainFiles = await names(p2);
              const prFiles = new Set(await names(p1));
              const overlap = mainFiles.filter((f) => prFiles.has(f));
              if (overlap.length) {
                return { ok: false, reason: `${baseRef} changed ${overlap.length} file(s) this PR also changes: ${overlap.slice(0, 10).join(', ')}${overlap.length > 10 ? ', …' : ''}` };
              }
              return { ok: true, parent1: p1, parent2: p2 };
            }
            // ---- SHA binding: server-side proof of the head at sign-off --
            // The sign-off ("labeled" event at time L) counts for head s
            // only if GitHub's OWN records show s was this PR's head right
            // before L: the LATEST server-timestamped head observation
            // created strictly before L is for s, and no
            // head_ref_force_pushed event to another SHA lies between that
            // observation and L. Head observations (all server-side, never
            // author-controlled):
            //   - this caller workflow's pull_request_target runs for this
            //     PR (head branch/repo match; same-repo PRs: pull_requests
            //     must contain the PR; fork PRs carry no association and
            //     match on head repo + branch) — every push / label / open
            //     event creates one, and a cancelled run still records the
            //     head it was created for;
            //   - its workflow_dispatch runs ON the PR branch (same-repo PRs);
            //   - the current event payload (pull_request.head.sha at
            //     pull_request.updated_at).
            // Committer dates are author-controlled (backdating) and REST
            // 'committed' timeline events carry no timestamp, so neither is
            // ever used. A run created after a push always postdates that
            // push, so this can only err towards stripping (fail closed):
            // a push whose run was cancelled by a later label event is
            // still a later head observation and invalidates the label.
            // Needs actions: read.
            let prRunsCache = null;
            async function prRuns() {
              if (prRunsCache) return prRunsCache;
              const { data: thisRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
              const self = `${owner}/${repo}`.toLowerCase();
              const headRepo = String(pr.head.repo?.full_name || '').toLowerCase();
              const isFork = !headRepo || headRepo !== self;
              const runs = [];
              for (const event of isFork ? ['pull_request_target'] : ['pull_request_target', 'workflow_dispatch']) {
                runs.push(...await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: thisRun.workflow_id, event, branch: pr.head.ref, per_page: 100,
                }));
              }
              const obs = runs
                .filter((r) => r.event === 'pull_request_target' || r.event === 'workflow_dispatch')
                .filter((r) => r.head_branch === pr.head.ref
                  && headRepo !== ''
                  && String(r.head_repository?.full_name || '').toLowerCase() === headRepo
                  && SHA_RE.test(String(r.head_sha || ''))
                  && Number.isFinite(Date.parse(r.created_at || '')))
                .filter((r) => {
                  const prs = r.pull_requests || [];
                  if (r.event === 'workflow_dispatch') return !isFork;
                  if (prs.some((p) => p?.number === prNumber)) return true;
                  // Fork PR runs never carry a PR association.
                  return isFork && prs.length === 0;
                })
                .map((r) => ({ sha: r.head_sha, t: Date.parse(r.created_at), id: r.id || 0, src: `run ${r.id}` }));
              const pSha = String(context.payload.pull_request?.head?.sha || '');
              const pT = Date.parse(context.payload.pull_request?.updated_at || '');
              if (context.eventName === 'pull_request_target' && context.payload.pull_request?.number === prNumber
                  && SHA_RE.test(pSha) && Number.isFinite(pT)) {
                obs.push({ sha: pSha, t: pT, id: Number.MAX_SAFE_INTEGER, src: 'event payload' });
              }
              prRunsCache = obs.sort((x, y) => x.t - y.t || x.id - y.id);
              return prRunsCache;
            }
            // Returns { ok } or { ok: false, reason }.
            async function headAtSignoff(s, labeledTime) {
              const earlier = (await prRuns()).filter((r) => r.t < labeledTime);
              const last = earlier[earlier.length - 1];
              if (!last) {
                return { ok: false, reason: `no gate run proves ${short(s)} was this PR's head when "${QA_LABEL}" was applied (no head observation before the label)` };
              }
              if (last.sha !== s) {
                return { ok: false, reason: `no gate run proves ${short(s)} was this PR's head when "${QA_LABEL}" was applied (head was ${short(last.sha)} at sign-off; the label predates the push of ${short(s)})` };
              }
              for (const ev of await timeline()) {
                if (ev.event !== 'head_ref_force_pushed' || !ev.created_at) continue;
                const ft = Date.parse(ev.created_at);
                // A force push TO s is consistent; anything else (incl. an
                // event without commit_id) may have moved the head away.
                if (ft >= last.t && ft < labeledTime && String(ev.commit_id || '') !== s) {
                  return { ok: false, reason: `no gate run proves ${short(s)} was this PR's head when "${QA_LABEL}" was applied (force push between the last head observation and the label)` };
                }
              }
              return { ok: true };
            }
            // Walk back over consecutive clean base merges until a head QA
            // provably signed off. Returns { ok, tested | reason }.
            async function qaAnchor(s, labeledTime, hops) {
              const b = await headAtSignoff(s, labeledTime);
              if (b.ok) return { ok: true, tested: s };
              const stale = b.reason;
              if (!KEEP_CLEAN) return { ok: false, reason: stale };
              if (hops >= MAX_HOPS) return { ok: false, reason: `${stale}; more than ${MAX_HOPS} consecutive merges since QA` };
              const prep = await prepareRepo([s]);
              if (!prep.ok) return prep;
              const m = await cleanMainMerge(s, null);
              if (!m.ok) return { ok: false, reason: `${stale}, and it is not a clean ${baseRef} merge: ${m.reason}` };
              return qaAnchor(m.parent1, labeledTime, hops + 1);
            }

            // New push: invalidate QA. Remove the label (if present) so a
            // stale sign-off can never satisfy this gate or auto-merge,
            // then fail. Removing an issue label needs issues:write /
            // pull-requests:write granted by the CALLER.
            // Race guard: a reviewer may apply the label seconds AFTER the
            // push but BEFORE this synchronize run executes. Keep the label
            // only if the sign-off is BOUND to the current head (the head
            // observation right before the label is this SHA — see
            // headAtSignoff); never by comparing against committer dates.
            let freshLabel = false;
            if (IS_SYNC && hasLabel) {
              try {
                const so = await signoff();
                if (so.ok) {
                  const b = await headAtSignoff(sha, so.labeledTime);
                  freshLabel = b.ok;
                  if (b.ok) core.info(`"${QA_LABEL}" was applied while ${short(sha)} was already the head — keeping it and evaluating normally`);
                }
              } catch (err) {
                core.info(`race-guard check failed (${err.message}) — treating the label as stale`);
                freshLabel = false;
              }
            }

            // keep_qa_on_clean_main_update: the push only merged the base
            // branch cleanly into the QA-tested head → keep the label. The
            // label itself is untouched, so its last 'labeled' event (and
            // labeler) is still the original QA sign-off.
            let kept = null;
            let keepReason = '';
            if (IS_SYNC && hasLabel && !freshLabel && KEEP_CLEAN) {
              try {
                const before = String(context.payload.before || '');
                const so = await signoff();
                if (context.payload.pull_request?.head?.sha !== sha) {
                  keepReason = `PR head moved to ${short(sha)} after this push event`;
                } else if (!so.ok) {
                  keepReason = so.msg;
                } else if (!SHA_RE.test(before) || /^0+$/.test(before)) {
                  keepReason = 'push event has no usable `before` SHA';
                } else {
                  const prep = await prepareRepo([sha, before]);
                  if (!prep.ok) {
                    keepReason = prep.reason;
                  } else {
                    const m = await cleanMainMerge(sha, before);
                    if (!m.ok) {
                      keepReason = m.reason;
                    } else {
                      const a = await qaAnchor(before, so.labeledTime, 1);
                      if (!a.ok) keepReason = `QA sign-off does not cover the previous head ${short(before)}: ${a.reason}`;
                      else kept = { tested: a.tested, before, p2: m.parent2 };
                    }
                  }
                }
              } catch (err) {
                kept = null;
                keepReason = `error while checking: ${err.message}`;
              }
              if (kept) {
                core.info(`Clean ${baseRef} merge ${short(sha)} = ${short(kept.before)} + ${short(kept.p2)} — keeping "${QA_LABEL}" (QA tested ${short(kept.tested)})`);
                await summary(`### QA Gate\n\`${QA_LABEL}\` kept: ${short(sha)} only merges \`${baseRef}\` (${short(kept.p2)}) cleanly into ${short(kept.before)}; QA tested ${short(kept.tested)}.`);
                const MARK = '<!-- devflow-qa-gate:clean-main-update -->';
                const body = `${MARK}\n仅干净合入 ${baseRef}（无冲突、无与本 PR 重叠的文件），${QA_LABEL} 保留；QA 测试基于 ${short(kept.tested)}\n\n<sub>head ${short(sha)} = merge(${short(kept.before)}, ${baseRef}@${short(kept.p2)}) · keep_qa_on_clean_main_update</sub>`;
                try {
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner, repo, issue_number: prNumber, per_page: 100,
                  });
                  const mine = comments.find((c) => c.user?.type === 'Bot' && c.user?.login === 'github-actions[bot]' && String(c.body || '').includes(MARK));
                  if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                  else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                } catch (err) {
                  core.warning(`Could not post the clean-merge comment (${err.message})`);
                }
              }
            }

            if (IS_SYNC && !freshLabel && !kept) {
              if (hasLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: QA_LABEL,
                  });
                  core.info(`Removed label "${QA_LABEL}" from PR #${prNumber} (new push)`);
                } catch (err) {
                  core.warning(
                    `Could not remove label "${QA_LABEL}" (${err.message}) — the caller workflow must grant pull-requests:write and issues:write`
                  );
                }
                if (KEEP_CLEAN) {
                  core.info(`keep_qa_on_clean_main_update: not kept — ${keepReason}`);
                  await summary(`### QA Gate\n\`${QA_LABEL}\` stripped on push to ${short(sha)} — not a clean \`${baseRef}\` merge: ${keepReason}`);
                }
              }
              const why = KEEP_CLEAN && hasLabel && keepReason ? ` (not a clean ${baseRef} merge: ${keepReason})` : '';
              const msg = `new push invalidated QA — head is now ${sha.slice(0, 7)}; re-run manual QA (templates/QA.md) and re-apply "${QA_LABEL}"${why}`;
              core.info(`PR #${prNumber}: ${msg}`);
              core.setFailed(msg);
              return;
            }

            if (!hasLabel) {
              if (pr.draft) {
                core.setFailed('PR is draft — QA gate fails until ready_for_review');
                return;
              }
              const msg = `PR #${prNumber} has no "${QA_LABEL}" label — manual QA not signed off on head ${sha.slice(0, 7)}. Follow templates/QA.md, verify the latest head, then apply the label.`;
              core.setFailed(msg);
              return;
            }

            const so = await signoff();
            if (!so.ok) {
              core.setFailed(pr.draft ? `PR is draft — QA gate fails until ready_for_review; also: ${so.msg}` : so.msg);
              return;
            }
            const labeledTime = so.labeledTime;
            core.info(`"${QA_LABEL}" applied at ${fmt(labeledTime)}; checking it is bound to head ${short(sha)}`);

            // The sign-off must be bound to the CURRENT head (server-side
            // head observations, never committer dates). With
            // keep_qa_on_clean_main_update the head may also be one or more
            // clean base merges on top of the head QA signed off.
            let a;
            try {
              a = await qaAnchor(sha, labeledTime, 0);
            } catch (err) {
              // API error (e.g. caller did not grant actions: read): the
              // binding cannot be proven → treat as stale (AGENTS.md: any
              // doubt or error strips the label).
              a = { ok: false, reason: `could not verify the binding (error while checking: ${err.message})` };
            }
            // Draft check runs AFTER the synchronize invalidation and the
            // stale-label check, so a draft PR can never keep a stale QA
            // label (push or cancelled push).
            if (a.ok && pr.draft) {
              const msg = 'PR is draft — QA gate fails until ready_for_review';
              core.info(`PR #${prNumber}: ${msg}`);
              core.setFailed(msg);
              return;
            }
            if (a.ok) {
              if (a.tested === sha) core.info(`QA verified: "${QA_LABEL}" was applied while ${short(sha)} was the PR head`);
              else core.info(`QA verified: "${QA_LABEL}" covers ${short(a.tested)}; head ${short(sha)} only adds clean ${baseRef} merge(s) (keep_qa_on_clean_main_update)`);
              // Success = job conclusion ("<caller job> / QA Gate").
              return;
            }
            // Stale label (e.g. the push's synchronize run was cancelled by
            // a later event): strip it like the synchronize path would, so
            // no automation sees it (fail closed).
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: QA_LABEL });
              core.info(`Removed stale label "${QA_LABEL}" from PR #${prNumber}`);
            } catch (err) {
              core.warning(`Could not remove label "${QA_LABEL}" (${err.message})`);
            }
            await summary(`### QA Gate\n\`${QA_LABEL}\` stripped — it predates the latest push to ${short(sha)}${KEEP_CLEAN ? ` and ${short(sha)} is not a clean \`${baseRef}\` merge of the QA-tested head` : ''}: ${a.reason}`);
            const msg = `QA label "${QA_LABEL}" predates the latest push (applied ${fmt(labeledTime)}, not bound to head ${short(sha)}). Re-run QA on head ${short(sha)} and re-apply the label. (${a.reason})`;
            core.setFailed(msg);
            return;

  # Schedule-path only (OPTIONAL — the example caller has no cron any
  # more: every QA input change — push, label, draft/ready — is itself a
  # pull_request_target event that evaluates and attaches the check). A
  # scheduled run's conclusion does not attach to any PR head check, so
  # this job never evaluates. Per open non-draft PR it looks at the
  # latest evaluated gate run on the current head and re-runs AT MOST ONE
  # run, never one already at run_attempt >= 3:
  #   - latest FAILED and the QA label is present with its last 'labeled'
  #     event AFTER that run started (the input changed after the
  #     evaluation, e.g. the label run was lost) → re-run its failed jobs;
  #   - otherwise the newest CANCELLED run on the head → re-run it (a
  #     cancelled required check is never the final word).
  # A gate that is legitimately red (no sign-off yet) is NEVER re-run.
  # Nothing is re-run while a run on that head is still in flight. Needs
  # actions:write granted by the CALLER on its schedule-path job.
  qa-gate-refresh:
    name: QA Gate Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Refresh failing gate checks
        uses: actions/github-script@v7
        env:
          QA_LABEL: ${{ inputs.qa_label }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const QA_LABEL = (process.env.QA_LABEL || 'qa-passed').trim() || 'qa-passed';
            const MAX_ATTEMPTS = 3;
            const POLL_MS = Number(process.env.REFRESH_POLL_MS ?? 10000);
            const POLL_TRIES = 4;

            // The run belongs to the CALLER workflow; identify it so we
            // re-run its (not some other workflow's) gate runs.
            const { data: thisRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });
            const workflowId = thisRun.workflow_id;
            core.info(`Refreshing gate checks for workflow "${thisRun.name}" (id ${workflowId})`);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            let scanned = 0;
            let rerun = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              scanned += 1;
              const sha = pr.head.sha;
              // Gate runs whose check sits on this PR head: pull_request_target
              // runs, plus workflow_dispatch runs dispatched ON the PR branch
              // (e.g. crawl.yml for a GITHUB_TOKEN-created PR, where no
              // pull_request(_target) event ever fires). A dispatch on
              // another ref has a different head_sha and is excluded.
              // ALL runs on the head (paginated): an older-created run that was
              // re-run recently may be the freshest check.
              async function headRuns() {
                const out = [];
                for (const event of ['pull_request_target', 'workflow_dispatch']) {
                  const list = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner,
                    repo,
                    workflow_id: workflowId,
                    head_sha: sha,
                    event,
                    per_page: 100,
                  });
                  out.push(...(list || []).filter((r) => r.head_sha === sha
                    && (event !== 'workflow_dispatch' || r.head_branch === pr.head.ref)));
                }
                return out;
              }
              // Something still queued/running on this head (often a caller-level
              // skip resolving in seconds): wait briefly; if it persists its result
              // will land on the check and re-running now could race it.
              const inFlight = (rs) => rs.some((r) => r.status && r.status !== 'completed');
              let runs = await headRuns();
              for (let i = 0; i < POLL_TRIES && inFlight(runs); i++) {
                await new Promise((res) => setTimeout(res, POLL_MS));
                runs = await headRuns();
              }
              if (inFlight(runs)) continue;
              // Caller-level skips (unrelated label events) conclude
              // 'skipped' and attach no gate check — ignore them.
              // Newest by the LATEST ATTEMPT's start (a re-run of an older
              // run is the freshest check), not by run creation time.
              const attemptAt = (r) => Date.parse(r.run_started_at || r.created_at || 0) || 0;
              const evaluated = runs
                .filter((r) => r.conclusion !== 'skipped')
                .sort((a, b) => (attemptAt(b) - attemptAt(a)) || ((b.id || 0) - (a.id || 0)));
              const capped = (r) => (r.run_attempt || 1) >= MAX_ATTEMPTS;
              const latest = evaluated[0];
              if (!latest) continue;
              if (latest.conclusion === 'failure' && !capped(latest)
                  && (pr.labels || []).some((l) => l.name === QA_LABEL)) {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: pr.number, per_page: 100,
                });
                const lastLabeled = events
                  .filter((e) => e.event === 'labeled' && e.label?.name === QA_LABEL && e.created_at)
                  .map((e) => Date.parse(e.created_at))
                  .sort((a, b) => b - a)[0];
                const evaluatedAt = Date.parse(latest.run_started_at || latest.created_at || 0);
                if (lastLabeled && Number.isFinite(evaluatedAt) && lastLabeled > evaluatedAt) {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: latest.id });
                  rerun += 1;
                  core.info(`PR #${pr.number}: "${QA_LABEL}" applied after run ${latest.id} evaluated — re-running its failed jobs (head ${sha.slice(0, 7)})`);
                  continue;
                }
              }
              const cancelled = evaluated.find((r) => r.conclusion === 'cancelled' && !capped(r));
              if (cancelled) {
                await github.rest.actions.reRunWorkflow({ owner, repo, run_id: cancelled.id });
                rerun += 1;
                core.info(`PR #${pr.number}: re-running cancelled run ${cancelled.id} (${cancelled.event}, head ${sha.slice(0, 7)})`);
              }
            }
            core.info(
              `QA Gate Refresh done: ${scanned} open non-draft PR(s) scanned, ${rerun} gate run(s) re-run`
            );
