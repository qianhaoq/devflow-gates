# Example caller for the reusable Diff Quiz Gate — copy to
# YOUR_REPO/.github/workflows/understand-gate.yml.
#
# Required-check name produced by this example (job id `understand`):
#   - "understand / Diff Quiz Gate"
#
# pull_request_target keeps the workflow YAML + LLM secrets on the trusted
# base branch. The reusable gate never checks out the PR head; it reads the
# diff via the GitHub API only.
#
# Triggers (no labeled/unlabeled — avoids "is expected" ghost check suites):
#   - pull_request_target: opened / synchronize / reopened only
#   - issue_comment → refresh when body has Diff Quiz Answer / Override /recheck
#   - workflow_dispatch(pr_number)
#
# ⛔ 禁止自监听（P0 根治）：本文件 name 为 "Diff Quiz Gate"，不得再写
#   on.workflow_run.workflows: ["Diff Quiz Gate"]。GitHub 不允许工作流监听
#   自身同名完成事件——整份 YAML 会 silent 失效，pull_request_target 不出
#   `understand / Diff Quiz Gate`，Auto Merge 也会 startup_failure。
#   cancel-heal 必须拆到独立文件，见 examples/understand-gate-cancel-heal.yml
#   （name 必须与 "Diff Quiz Gate" 不同，例如 "Diff Quiz Gate Cancel Heal"）。
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   GLM_API_KEY  or  ZHIPU_API_KEY  （智谱 GLM Coding Plan）

name: Diff Quiz Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: >-
    understand-gate-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'issue_comment' && 'refresh') ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}

jobs:
  understand:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/understand-gate.yml@main
    with:
      # runs_on: '["self-hosted", "linux", "x64"]'
      glm_model: 'glm-5.3-flash'
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

  understand-refresh:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, '## Diff Quiz Answer') ||
       contains(github.event.comment.body, '## Diff Quiz Override') ||
       startsWith(github.event.comment.body, '/recheck'))
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/understand-gate.yml@main
    with:
      # runs_on: '["self-hosted", "linux", "x64"]'
      glm_model: 'glm-5.3-flash'
    secrets:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
