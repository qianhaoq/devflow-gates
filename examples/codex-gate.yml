# Example caller for the reusable Codex Review Gate — copy to
# YOUR_REPO/.github/workflows/codex-gate.yml.
#
# Required-check name produced by this example (job id `codex`):
#   - "codex / Codex Review Gate"
#
# pull_request_target keeps the workflow YAML on the trusted base branch
# while evaluating untrusted PRs; the reusable gate is read-only and
# never checks out the PR head.
#
# Triggers (PR-only, deduplicated to save Actions minutes):
#   - pull_request_target: opened / synchronize / reopened / ready_for_review /
#     converted_to_draft ONLY — NO labeled/unlabeled (same policy as
#     understand-gate). A labeled run whose caller jobs all skip creates a
#     check suite with no "codex / Codex Review Gate" run → GitHub hangs on
#     "is expected". `skip-codex-gate` is still honored on every evaluate
#     (and by Auto Merge immediately); after adding/removing it, comment
#     "/recheck" (or push / wait for a Codex review) to refresh the Gate check.
#   - pull_request_review (submitted) by Codex only. One Codex review with
#     N inline comments = ONE run.
#   - pull_request_review_comment by Codex only, and only when it is an
#     EDIT or a thread REPLY (e.g. a finding edited into P0/P1). New
#     top-level inline comments are part of a submitted review, which
#     already evaluates — the old unfiltered trigger fired N more runs.
#   - issue_comment → the REFRESH job, only for comments by Codex (summary
#     created/edited, "no major issues") or a "/recheck" comment. Its
#     conclusion would land on the default branch, so it does not
#     evaluate: it re-runs the latest failed head gate run only if the
#     gate would now pass (else at most the newest cancelled one; one
#     re-run per PR; never past run_attempt 3).
#   - workflow_dispatch(pr_number): evaluates; attaches to the PR head only
#     when dispatched ON the PR branch (e.g. GITHUB_TOKEN-created PRs).
#   - No schedule: thread resolution (webhook-only, cannot trigger
#     Actions) is picked up by the next Codex comment, a push, or a
#     "/recheck" comment on the PR. Add an hourly-or-slower cron only if
#     you really need it (each scheduled run boots a runner).
#   - workflow_run(completed) — SELF-LISTENING, cancel-heal only (job
#     `codex-cancel-heal`): a cancelled run cannot run its own post
#     steps, so this workflow listens for its own completions (fires from
#     the default branch only; GitHub caps workflow_run chains at 3
#     levels, so self-listening cannot loop). Only cancelled completions
#     of PR-head runs boot a runner — every other completion skips all
#     jobs without billing.
#
# Concurrency (never lets one event class cancel another):
#   - push-class runs (opened / synchronize / reopened) share one group per
#     PR with cancel-in-progress: a new commit cancels the evaluation of
#     the OLDER head only (that cancelled check sits on the old SHA).
#   - relevant refresh runs (Codex / "/recheck" comments) queue per PR
#     (a running one is never cancelled).
#   - cancel-heal runs (workflow_run cancelled) each get their OWN
#     'heal-<triggering run id>' group: workflow_run payloads carry no PR
#     number, so a shared group would let a newly queued heal silently
#     replace an older still-pending one. Never cancelled — a heal must not
#     be cancelled by a newer push (the re-run preserves the ORIGINAL event
#     and never joins the push group).
#   - every other run (Codex reviews, dispatch, skipped events)
#     gets its own group: never cancelled, never cancels. Gate runs are
#     ~15 s, read live state, and are idempotent.

name: Codex Review Gate

on:
  pull_request_target:
    # No labeled/unlabeled — prevents "is expected" ghost suites (see header).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string
  # Self-listening for cancel-heal (see the `codex-cancel-heal` job):
  # fires from the default branch only, on every completion of this
  # workflow. Non-cancelled completions skip all jobs (no runner boots).
  workflow_run:
    workflows: ["Codex Review Gate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  group: >-
    codex-gate-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'issue_comment' &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))) && 'refresh' ||
    (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'cancelled') && format('heal-{0}', github.event.workflow_run.id) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}

jobs:
  codex:
    # Caller-level filter: irrelevant review/comment events skip WITHOUT
    # booting a runner (check named "codex", not the required one). Label
    # events are not in `on:` at all — see header (B: no ghost suite).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector') &&
        (github.event.action == 'edited' || github.event.comment.in_reply_to_id))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the refresh job, which needs actions: write); the
    # evaluator's own token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@main
    with:
      # runs_on: self-hosted   # optional; default ubuntu-latest (also set on refresh)
      wait_minutes: 20
      # Default true (policy: unlabeled Codex threads block). Set false to
      # opt out to keyword-only matching for unlabeled threads.
      block_unlabeled: true

  # Refresh path — Codex comments and "/recheck" only (see header).
  codex-refresh:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
       github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@main
    with:
      # runs_on: self-hosted   # keep in sync with codex job above
      wait_minutes: 20
      block_unlabeled: true

  # Cancel-heal — a cancelled run cannot run its own post steps, so this
  # job (fed by the self-listening workflow_run trigger above) re-runs the
  # TRIGGERING cancelled run via the reusable refresh path: branch
  # protection gates on the LATEST check run per required name on the head
  # SHA, and a cancelled latest blocks merge even when the change is
  # substantively green. Same caps as every refresh: at most one re-run
  # per PR, never past run_attempt 3, never while a run is in flight —
  # no blind re-runs, and a re-run preserves the ORIGINAL event so the
  # fresh conclusion re-attaches to the PR head check. Push-originated
  # cancellations are excluded: their head is the default branch, not a
  # PR head. Non-cancelled completions of this workflow also reach this
  # `if:` and skip it (no runner boots).
  codex-cancel-heal:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event != 'push'
    permissions:
      # Same ceiling as codex-refresh: the reusable refresh job needs
      # actions: write to re-run the cancelled run.
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@main
    with:
      # runs_on: self-hosted   # keep in sync with codex job above
      wait_minutes: 20
      block_unlabeled: true
