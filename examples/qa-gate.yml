# Example caller for the reusable QA Gate — copy to
# YOUR_REPO/.github/workflows/qa-gate.yml.
#
# Required-check name produced by this example (job id `qa`):
#   - "qa / QA Gate"
#
# pull_request_target keeps the workflow YAML on the trusted base branch.
#
# IMPORTANT: the gate REMOVES the QA label on every new push
# (synchronize), which needs write access — the caller must grant
# pull-requests: write and issues: write (a reusable workflow can only
# restrict permissions further, never elevate them).
#
# Schedule (*/15): a scheduled run's own conclusion does NOT attach to
# any PR head check, so the schedule path never evaluates. The reusable
# workflow's "QA Gate Refresh" job instead re-runs the most recent FAILED
# pull_request_target-originated Gate run for every open non-draft PR
# whose gate check is failing (actions.reRunWorkflowFailedJobs) — the
# re-run keeps the original pull_request_target event, so the fresh
# conclusion re-attaches to the PR head check. That API needs
# `actions: write`, granted here on the schedule-path job ONLY
# (`qa-refresh`); the evaluator job `qa` keeps the label-removal
# permissions only. Expect failing PRs to be re-evaluated every 15
# minutes until green or closed.
#
# Concurrency: synchronize (push) runs get their own group per head SHA
# and are NEVER cancelled (cancel-in-progress is false for them), so a
# label/unlabel event right after a push cannot cancel the run that strips
# the label. Other pull_request_target events share one per-PR group and
# cancel each other (they all evaluate the current state);
# workflow_dispatch re-evaluations use a separate group so they cannot
# cancel a run that attaches the PR-head check. Schedule runs fall back to
# a unique run_id group (nothing to cancel). The gate itself does not rely
# on this: a stale label is stripped on ANY event (fail closed).

name: QA Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (e.g. after re-applying the QA label)'
        required: true
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: >-
    qa-gate-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}-${{
    github.event_name != 'pull_request_target' && 'aux' ||
    github.event.action == 'synchronize' && format('sync-{0}', github.event.pull_request.head.sha) ||
    'target' }}
  cancel-in-progress: ${{ github.event.action != 'synchronize' }}

jobs:
  qa:
    if: github.event_name != 'schedule'
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the skipped refresh job, which needs actions: write);
    # the evaluator itself narrows to actions: read.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@main
    with:
      qa_label: 'qa-passed'
      # allowed_labelers: 'alice, bob'   # optional: only these users' label counts
      # keep_qa_on_clean_main_update: true   # optional: a clean "update branch" merge of main keeps the label

  # Schedule path only — see the header note. actions: write is scoped to
  # this job; it re-runs failing pull_request_target gate runs.
  qa-refresh:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@main
